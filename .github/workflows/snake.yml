name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Pratiksha3415
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Crop empty space from snake
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          for path in files:
              text = path.read_text()

              # Crop approximately the leftmost 15% of the generated SVG.
              text = re.sub(
                  r'<svg([^>]*)viewBox="0 0 ([0-9.]+) ([0-9.]+)"',
                  lambda m: (
                      f'<svg{m.group(1)}viewBox="'
                      f'0 0 {float(m.group(2)) * 0.85:.2f} {m.group(3)}"'
                  ),
                  text
              )

              path.write_text(text)
          PY

      - name: Push generated snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
